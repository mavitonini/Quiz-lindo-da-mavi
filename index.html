<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Fofo ✨</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1 id="titulo">✨ Quiz Mágico ✨</h1>
    <div id="quiz-container">
      <p id="pergunta" class="pergunta-texto"></p>
      <div id="opcoes" class="opcoes-container"></div>
    </div>
    <div id="resultado-container" class="escondido">
      <h2 id="resultado-texto"></h2>
      <button class="btn-refazer" onclick="reiniciarQuiz()">Tentar Novamente 💖</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
